schema_version: 1
format: flat-project-registry-v1
updated: 2026-07-29

contract:
  canonical_id: project_id
  null_literal: null
  required_fields:
    - project_id
    - display_name
    - lifecycle
    - project_kind
    - repository_path
    - wiki_page
    - knowledge_tier
    - config_source
    - config_authority
    - config_write_policy
    - agentmemory_status
    - codegraph_status
    - verification_status
  enums:
    lifecycle: [active, maintenance, dormant, archived, legacy-only]
    knowledge_tier: [full, bridge, registry-only]
    config_source: [nacos, repository, local-files, none, unknown]
    config_authority: [remote-current, project-files, local-artifacts, not-applicable, verify-before-use]
    config_write_policy: [explicit-user-request-only, project-files-only, not-applicable]
    capability_status: [verified, configured, available, missing, not-applicable, needs-review, unknown]
    database_access: [read-only, controlled, none, unknown]
    auth_workflow: [local-demo-first, external-login, not-applicable]
    browser_session_policy: [reuse-existing-before-login, fresh-login, not-applicable]

policies:
  governance_source: nearest-project-agents
  code_source: current-repository
  durable_knowledge_source: cxmvault-project-page
  reusable_memory_source: project-agentmemory
  legacy_source: provenance-only
  browser_auth: registered-test-harness-first
  nacos:
    authority: remote-current
    rule: remote target namespace/group/dataId current content is the latest runtime configuration fact
    repository_role: locator-bootstrap-reference-only
    snapshot_role: recovery-only
    payload_storage: forbidden
    write_policy: explicit-user-request-only

frontmatter_mirror:
  - project_id
  - project_lifecycle
  - knowledge_tier
  - config_source
  - config_authority
  - agentmemory_status
  - codegraph_status
  - verification_status
  - last_verified

